# TEMPLATE — do not install this over a live config without diffing first.
#
# The copy under /etc/nginx/sites-available holds two things this file cannot:
# the real server_name, and the TLS block certbot writes in place. Overwriting it
# drops both, and nginx then hands requests for this domain to whichever other
# site listens on that port — on a server with more than one vhost, that means
# visitors land on somebody else's site. Diff before installing:
#
#   diff -u /etc/nginx/sites-available/whiteraven-blog deploy/nginx/whiteraven-blog.conf
#
# Then merge the changes by hand, or re-run `certbot --nginx -d <domain>` after
# installing to restore the TLS block.

server {
    listen 80;
    listen [::]:80;

    # A catch-all here would swallow requests meant for other sites sharing this
    # server, so the domain is named explicitly.
    server_name blog.wh1teraven.site;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/www/logs/whiteraven-blog/nginx-access.log;
    error_log /var/www/logs/whiteraven-blog/nginx-error.log warn;

    root /var/www/apps/whiteraven-blog/current/frontend/dist;
    index index.html;

    client_max_body_size 12m;

    location = /sitemap.xml {
        proxy_pass http://unix:/var/www/tmp/whiteraven-blog/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /rss.xml {
        proxy_pass http://unix:/var/www/tmp/whiteraven-blog/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://unix:/var/www/tmp/whiteraven-blog/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://unix:/var/www/tmp/whiteraven-blog/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/shared/whiteraven-blog/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # nginx drops inherited add_header directives as soon as a block sets its
        # own, so the server-level security headers are repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /media/ {
        alias /var/www/shared/whiteraven-blog/media/;
        expires 7d;
        add_header Cache-Control "public";
        # nginx drops inherited add_header directives as soon as a block sets its
        # own, so the server-level security headers are repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Vite emits content-hashed filenames here, so they are safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx drops inherited add_header directives as soon as a block sets its
        # own, so the server-level security headers are repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # index.html names the hashed asset bundles for the current release. A cached
    # copy points at files the next deployment deletes, which leaves the browser
    # with 404s for its CSS and JS, so it is always revalidated.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
        # nginx drops inherited add_header directives as soon as a block sets its
        # own, so the server-level security headers are repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
