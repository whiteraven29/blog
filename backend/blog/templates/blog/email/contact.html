{% extends "blog/email/_base.html" %}
{% block content %}
<h1 style="margin:0 0 12px;font-size:20px;">{{ message.subject }}</h1>
<p style="margin:0 0 16px;font-size:14px;color:#5b5b6b;">From {{ message.name }} &lt;{{ message.email }}&gt;. Reply to this email to answer them.</p>
<div style="white-space:pre-wrap;line-height:1.6;border-left:3px solid #e9d5ff;padding-left:12px;">{{ message.message }}</div>
{% endblock %}
